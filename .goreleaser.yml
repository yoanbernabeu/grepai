version: 2

before:
  hooks:
    - go mod download

# The tree-sitter grammars are C, so releases build with CGO_ENABLED=1 and
# every target needs its own cross toolchain. Those toolchains come from the
# ghcr.io/goreleaser/goreleaser-cross image that release.yml runs this config
# inside — osxcross for darwin, aarch64 cross-gcc for linux/arm64, mingw-w64
# for windows. One build entry per target keeps each CC/CXX pairing visible
# rather than hidden in a nested template.
builds:
  - id: linux-amd64
    main: ./cmd/grepai
    binary: grepai
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: linux-arm64
    main: ./cmd/grepai
    binary: grepai
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: darwin-amd64
    main: ./cmd/grepai
    binary: grepai
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: darwin-arm64
    main: ./cmd/grepai
    binary: grepai
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: windows-amd64
    main: ./cmd/grepai
    binary: grepai
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: yoanbernabeu
    name: grepai
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## grepai {{ .Version }}

    Semantic code search CLI tool.
  footer: |
    ---

    **Full Changelog**: https://github.com/yoanbernabeu/grepai/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - repository:
      owner: yoanbernabeu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/yoanbernabeu/grepai
    description: "Privacy-first semantic code search CLI"
    license: MIT
    install: |
      bin.install "grepai"
    test: |
      system "#{bin}/grepai", "--version"
