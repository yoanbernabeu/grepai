name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  postgres-test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: grepai
          POSTGRES_PASSWORD: grepai_test
          POSTGRES_DB: grepai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grepai -d grepai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL integration tests
        env:
          GREPAI_POSTGRES_TEST_DSN: postgres://grepai:grepai_test@localhost:5432/grepai_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage-postgres.out -covermode=atomic ./trace ./mcp ./cli

      - name: Upload PostgreSQL coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage-postgres.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, postgres-test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o grepai-linux-amd64 ./cmd/grepai
          GOOS=linux GOARCH=arm64 go build -o grepai-linux-arm64 ./cmd/grepai
          GOOS=darwin GOARCH=amd64 go build -o grepai-darwin-amd64 ./cmd/grepai
          GOOS=darwin GOARCH=arm64 go build -o grepai-darwin-arm64 ./cmd/grepai
          GOOS=windows GOARCH=amd64 go build -o grepai-windows-amd64.exe ./cmd/grepai

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: grepai-*
